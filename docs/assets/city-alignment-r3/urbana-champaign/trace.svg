   <text style="fill: #132f51; font: 700 15px 'DejaVu Serif', serif; text-anchor: start" x="40.330312" y="30.797656" transform="rotate(-0 40.330312 30.797656)">Saved Frank–Wolfe checks and objective</text>
  </g>
  <g id="text_30">
   <text style="fill: #132f51; font: 8px 'DejaVu Serif', serif" transform="translate(44.110312 333.4721)">Only iteration 0 exists. No update curve, artificial log floor or interpolated points are added.</text>
   <text style="fill: #132f51; font: 8px 'DejaVu Serif', serif" transform="translate(44.110312 342.5441)">An accepted numerical gap concerns this scenario and demand set; it does not certify real traffic conditions.</text>
  </g>
 </g>
