<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#087F8C"/></marker><linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112A42"/><stop offset="1" stop-color="#1F4758"/></linearGradient></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1440" height="890" rx="0" fill="url(#dark)"/><text x="55" y="68" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#49C5B6" font-weight="700" text-anchor="start">MOBILITY COMPUTATION LAB</text><text x="55" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" fill="white" font-weight="700" text-anchor="start">One framework. Explicit inputs. Traceable computation.</text><text x="55" y="156" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#BDD0DB" font-weight="400" text-anchor="start">Conceptual overview — capability support and case evidence are listed separately.</text><rect x="55" y="197" width="1330" height="100" rx="12" fill="#234B5C"/><text x="78" y="232" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#49C5B6" font-weight="700" text-anchor="start">GMNS DATA FOUNDATION</text><text x="78" y="273" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="white" font-weight="600" text-anchor="start">zones + hierarchy  •  centroids + access  •  directed physical links  •  source IDs + units</text><rect x="55" y="352" width="310" height="112" rx="12" fill="white"/><text x="74" y="380" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#087F8C" font-weight="700" text-anchor="start">01</text><text x="74" y="410" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#132C42" font-weight="700" text-anchor="start">Trip generation</text><text x="74" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5B7182" font-weight="400" text-anchor="start">Activities → productions / attractions</text><line x1="365" y1="408" x2="386" y2="408" stroke="#49C5B6" stroke-width="2" opacity="1" marker-end="url(#arr)"/><rect x="395" y="352" width="310" height="112" rx="12" fill="white"/><text x="414" y="380" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#087F8C" font-weight="700" text-anchor="start">02</text><text x="414" y="410" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#132C42" font-weight="700" text-anchor="start">Trip distribution</text><text x="414" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5B7182" font-weight="400" text-anchor="start">Margins + impedance → person OD</text><line x1="705" y1="408" x2="726" y2="408" stroke="#49C5B6" stroke-width="2" opacity="1" marker-end="url(#arr)"/><rect x="735" y="352" width="310" height="112" rx="12" fill="white"/><text x="754" y="380" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#087F8C" font-weight="700" text-anchor="start">03</text><text x="754" y="410" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#132C42" font-weight="700" text-anchor="start">Mode choice</text><text x="754" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5B7182" font-weight="400" text-anchor="start">Costs + a declared model → mode demand</text><line x1="1045" y1="408" x2="1066" y2="408" stroke="#49C5B6" stroke-width="2" opacity="1" marker-end="url(#arr)"/><rect x="1075" y="352" width="310" height="112" rx="12" fill="white"/><text x="1094" y="380" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#087F8C" font-weight="700" text-anchor="start">04</text><text x="1094" y="410" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#132C42" font-weight="700" text-anchor="start">Traffic assignment</text><text x="1094" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5B7182" font-weight="400" text-anchor="start">Vehicle OD → selected network method</text><rect x="55" y="497" width="645" height="103" rx="12" fill="#234B5C"/><text x="77" y="530" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#49C5B6" font-weight="700" text-anchor="start">OBSERVATION PATH</text><text x="77" y="563" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="start">GPS / service evidence → QC → map matching → parameters</text><text x="77" y="585" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#BDD0DB" font-weight="400" text-anchor="start">Feeds supported cost/parameter inputs; not automatic passenger-OD recovery.</text><path d="M700 548 L870 548 L870 466" fill="none" stroke="#49C5B6" stroke-width="2" marker-end="url(#arr)"/><rect x="735" y="623" width="650" height="100" rx="12" fill="#234B5C"/><text x="757" y="653" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#49C5B6" font-weight="700" text-anchor="start">STATIC FIXED-DEMAND METHODS</text><text x="757" y="687" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="start">Frank–Wolfe  |  finite-path reference  |  native Diagnostic L3</text><text x="757" y="708" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#BDD0DB" font-weight="400" text-anchor="start">Beckmann objective • different representations • original-space checks</text><rect x="55" y="623" width="650" height="100" rx="12" fill="#234B5C"/><text x="77" y="653" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#49C5B6" font-weight="700" text-anchor="start">FINITE SPACE–TIME METHOD</text><text x="77" y="687" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="start">Time expansion → Phase I → Phase II / column generation</text><text x="77" y="708" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#BDD0DB" font-weight="400" text-anchor="start">Linear cost + explicit capacities • same-instance arc-flow LP reference</text><path d="M1230 465 L1230 608" fill="none" stroke="#49C5B6" stroke-width="2" marker-end="url(#arr)"/><path d="M1230 484 L710 484 L710 610 L670 610 L670 623" fill="none" stroke="#49C5B6" stroke-width="2" marker-end="url(#arr)"/><rect x="55" y="774" width="1330" height="72" rx="12" fill="white"/><text x="79" y="816" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#087F8C" font-weight="700" text-anchor="start">OUTPUT CONTRACT</text><text x="310" y="816" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#132C42" font-weight="600" text-anchor="start">path / link flow  •  demand accounting  •  validation  •  reproducible maps &amp; tables</text><line x1="380" y1="723" x2="380" y2="772" stroke="#49C5B6" stroke-width="2" opacity="1" marker-end="url(#arr)"/><line x1="1060" y1="723" x2="1060" y2="772" stroke="#49C5B6" stroke-width="2" opacity="1" marker-end="url(#arr)"/><text x="57" y="878" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#BDD0DB" font-weight="400" text-anchor="start">Users with declared vehicle OD may enter directly at assignment. These branches are not one interchangeable optimization problem.</text></svg>