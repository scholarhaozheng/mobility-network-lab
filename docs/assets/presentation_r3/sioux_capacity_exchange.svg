<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="730" viewBox="0 0 1440 730"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#087F8C"/></marker><linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112A42"/><stop offset="1" stop-color="#1F4758"/></linearGradient></defs><rect width="100%" height="100%" fill="white"/><text x="55" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#087F8C" font-weight="700" text-anchor="start">WHY PHASE I NEEDS PRICING</text><text x="55" y="102" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#132C42" font-weight="700" text-anchor="start">A new path for one OD can clear artificial flow for another.</text><text x="55" y="142" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5B7182" font-weight="400" text-anchor="start">Recorded Sioux Falls event: round 34 in the 200-OD case, round 39 in the 250-OD case.</text><rect x="55" y="187" width="615" height="334" rx="12" fill="#F3F7FA"/><text x="80" y="225" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#087F8C" font-weight="700" text-anchor="start">BEFORE ADDING THE XS170 PATH</text><text x="80" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#132C42" font-weight="700" text-anchor="start">Shared time arc  xs_link21_t1</text><rect x="80" y="301" width="479.18960720907097" height="62" rx="0" fill="#BECFD8"/><rect x="559.189607209071" y="301" width="16.357028335352727" height="62" rx="0" fill="#087F8C"/><rect x="575.5466355444237" y="301" width="54.45336445557625" height="62" rx="0" fill="#DAA54A"/><text x="80" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#132C42" font-weight="600" text-anchor="start">Arc load / capacity: 5,050.193 / 5,050.193</text><text x="80" y="433" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5B7182" font-weight="400" text-anchor="start">XS170 uses its delayed route: 500 units</text><text x="80" y="464" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5B7182" font-weight="400" text-anchor="start">XS169 still needs 500 more units of capacity</text><rect x="770" y="187" width="615" height="334" rx="12" fill="#F3F7FA"/><text x="795" y="225" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#087F8C" font-weight="700" text-anchor="start">AFTER MASTER REOPTIMIZATION</text><text x="795" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#132C42" font-weight="700" text-anchor="start">Shared time arc  xs_link21_t1</text><rect x="795" y="301" width="479.18960720907097" height="62" rx="0" fill="#BECFD8"/><rect x="1274.189607209071" y="301" width="70.81039279092897" height="62" rx="0" fill="#087F8C"/><text x="795" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#132C42" font-weight="600" text-anchor="start">Arc load / capacity: 5,050.193 / 5,050.193</text><text x="795" y="433" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5B7182" font-weight="400" text-anchor="start">XS170 on this arc: 500 → 0</text><text x="795" y="464" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5B7182" font-weight="400" text-anchor="start">XS169 on this arc: 150.193 → 650.193</text><line x1="680" y1="345" x2="755" y2="345" stroke="#087F8C" stroke-width="3" opacity="1" marker-end="url(#arr)"/><rect x="55" y="554" width="1330" height="93" rx="12" fill="#132C42"/><text x="80" y="591" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#49C5B6" font-weight="700" text-anchor="start">THE NETWORK EFFECT</text><text x="80" y="625" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="white" font-weight="600" text-anchor="start">XS170 demand stays at 500; XS169 artificial mass decreases by 500; the capacity constraint stays binding.</text><text x="55" y="689" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5B7182" font-weight="400" text-anchor="start">Saved primal-flow evidence explains the exchange. The raw reported capacity dual remains approximately −1 under its solver convention.</text></svg>